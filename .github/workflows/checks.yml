name: Package checks
on:
  push:
    branches: ['main']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate package and run isolated Windows tests
        shell: powershell
        run: .\scripts\Test-Package.ps1
